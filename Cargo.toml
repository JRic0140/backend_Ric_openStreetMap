[package]
name = "rust_backend_for_ric_open_street_map"
version = "0.1.0"
edition = "2024"

[dependencies]

# Librerías de Base de Datos
# rusqlite = "0.30.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# Librerías Backend/Web
axum = "0.8.7"
axum-macros = "0.5.0" 

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Librerías de Serialización
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"

chrono = { version = "0.4", features = ["serde"] }

# jwt = "0.16.0"
jsonwebtoken = "9"
# serde = { version = "1.0", features = ["derive"] }
# jsonwebtoken = "10.2.0"
# base64 = "0.22.1"
dotenv = "0.15"
rust-argon2 = "3.0.0"
password-hash = "0.5.0"
rand = "0.9.2"
axum-cookie = "0.2.4"
tower-cookies = "0.11.0"
